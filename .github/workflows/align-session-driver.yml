# Align the production SESSION_DRIVER - CL-10, WS-1.
#
# ⛔ DISPATCHING THIS WORKFLOW CHANGES PRODUCTION AND SIGNS EVERY USER OUT.
# It requires a Product Owner GO. See
# doc/v2/phase-1/PHASE-1-CLOSEOUT-WS-1-SESSION-DRIVER-RUNBOOK.md §13. The
# existence of this file is NOT that authorisation: the runbook is approved and
# this tooling is approved to BUILD, which is not permission to RUN it.
#
# MANUAL DISPATCH ONLY. There is no push trigger, no schedule and no
# workflow_call, and nothing in deploy.yml invokes the driver script. deploy.yml
# fires on every push to main, including a documentation merge; a driver switch
# happens once, in a chosen window, behind a go/no-go.
#
# FORWARD AND ROLLBACK ARE THE SAME WORKFLOW. `database` is the change, `file`
# is the rollback, and both run the same checked-in script. A rollback path made
# of different code is a path nobody has ever run.
#
# CONCURRENCY. The group is `cpanel-deploy` - the SAME group deploy.yml uses,
# with cancel-in-progress false. A deployment rsyncing the application while
# this rewrites .env, or the reverse, is the kind of interleaving that produces
# a state nobody can reason about afterwards. Sharing the group makes them queue
# rather than race, and never cancelling means neither is killed mid-mutation.
#
# WHAT IT NEVER DOES: display .env, any credential or any session content;
# modify identity or Entra configuration; touch APP_KEY; run migrations; accept
# an arbitrary key or an arbitrary value. The only thing it can change is
# SESSION_DRIVER, and only to `file` or `database`.
#
# SSH reuses the established pattern from the read-only verification workflows,
# ssh-agent and askpass included: the deploy key is passphrase-protected, and
# writing the key file alone produces "Permission denied (publickey)". The
# script is piped over stdin rather than copied to the host - deployment/ is
# excluded from rsync and this script has no business living there.
#
# ---------------------------------------------------------------------------
# THREE PROPERTIES ADDED IN TOOLING REVIEW ROUND 1. Each one closes a defect
# found by source review that CI did not catch.
# ---------------------------------------------------------------------------
#
# 1. AN ALIGNED DEPLOYMENT IS A NO-OP, AND THE NO-OP COSTS NOBODY ANYTHING.
#
# The script is idempotent; the workflow was not. Dispatching `database` at a
# deployment already on `database` still opened a maintenance window, piped the
# script, cleared caches and closed the window again - an interruption for a
# change that does not exist. The starting driver is now established BEFORE
# anything is touched, and every mutating and maintenance step is gated on
# `change_required`. An aligned deployment is never taken down.
#
# 2. FAILING CLOSED MEANS PUTTING THE SITE BACK DOWN, NOT SAYING IT IS DOWN.
#
# The previous recovery step announced that the site had been "LEFT IN
# MAINTENANCE" without running anything that would make that true. A failure
# after `artisan up` had already run - in the HTTPS verification, or in the
# reporting - would therefore have left a changed, unverified deployment
# SERVING USERS while the log said the opposite. A message is not a mechanism.
# The recovery step now runs `artisan down` itself, then READS the maintenance
# state back, and only claims maintenance when the application says so.
#
# 3. THIS WORKFLOW NEVER CLOSES A WINDOW IT DID NOT OPEN.
#
# `artisan up` releases whatever maintenance mode is in effect, including one
# opened by a deployment or by a person mid-operation. So: production is checked
# for existing maintenance BEFORE this run opens its own, and refuses if it
# finds one; the open step records ownership; and recovery only runs `artisan
# up` when this run is the owner.
#
# THERE IS STILL NO AUTOMATIC ROLLBACK. Rolling the driver back on failure would
# be a second unattended production mutation on a path already known to be
# misbehaving. Recovery establishes the state, secures it, and names the
# explicit rollback - this same workflow with the starting driver as target.
name: Align production SESSION_DRIVER (manual, CL-10)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Session driver production should be running after this run'
        required: true
        type: choice
        options:
          - database
          - file
      confirmation:
        description: 'Type ALIGN SESSION DRIVER to confirm. Every signed-in user will be signed out.'
        required: true
        type: string

# The same group as deploy.yml, on purpose. See the note above.
concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  align:
    name: Change SESSION_DRIVER on the production server
    runs-on: ubuntu-latest
    environment: development

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      APP_URL: https://semantiq.claas2saas.com
      TARGET_DRIVER: ${{ inputs.target }}

    steps:
      # EVERY VALIDATION HAPPENS BEFORE ANY SSH MUTATION, and the ref check is
      # first because a dispatch from a branch is the one mistake that could
      # otherwise run an unreviewed script against production.
      - name: Refuse unless this was dispatched from main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow may only be dispatched from main. It was dispatched from ${{ github.ref }}."
            exit 1
          fi
          echo "::notice::Dispatched from main."

      # A typed phrase, not a checkbox. The dropdown alone would let a stray
      # click on a repeated dispatch sign every user out.
      - name: Refuse unless the confirmation phrase is exact
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "ALIGN SESSION DRIVER" ]; then
            echo "::error::The confirmation phrase was not exactly ALIGN SESSION DRIVER. Nothing was changed."
            exit 1
          fi
          echo "::notice::Confirmation accepted."

      # Belt and braces: the choice input already restricts this, but a choice
      # list is part of the workflow file and this is part of the run.
      - name: Refuse an unrecognised target driver
        run: |
          set -euo pipefail
          case "$TARGET_DRIVER" in
            file|database) echo "::notice::Requested target driver: $TARGET_DRIVER" ;;
            *) echo "::error::[$TARGET_DRIVER] is not a session driver this workflow will set."; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          : "${CPANEL_SSH_PRIVATE_KEY:?CPANEL_SSH_PRIVATE_KEY secret is required}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?CPANEL_SSH_KEY_PASSPHRASE secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/cpanel_deploy_key </dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      # P-10 in the runbook: never start a change whose rollback path is
      # unverified. Rollback is this same workflow over this same connection, so
      # the connection is proven before the maintenance window opens rather than
      # discovered to be broken when it is needed.
      - name: Verify SSH access before anything is changed
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && test -f artisan && test -f .env && echo REACHABLE" \
            | grep -qx REACHABLE

          echo "::notice::The deployment is reachable and rollback can be performed over this connection."

      # ESTABLISH THE STARTING DRIVER, AND DECIDE WHETHER THERE IS A CHANGE TO
      # MAKE AT ALL - before the site is touched.
      #
      # The starting driver is READ, never assumed, and an unrecognised value
      # stops the run before production is touched. Only the driver name is
      # printed: a configuration choice, not a credential.
      #
      # `change_required` is what gates every mutating and maintenance step
      # below. A deployment already on the requested driver is not taken down
      # to be told it is already correct.
      - name: Establish the starting session driver and decide whether anything must change
        id: plan
        run: |
          set -euo pipefail

          starting="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan tinker --execute='echo (string) config(\"session.driver\");'" \
            | tr -d '[:space:]')"

          case "$starting" in
            file|database) ;;
            *)
              echo "::error::The production session driver is not one this workflow recognises. Nothing was changed."
              exit 1
              ;;
          esac

          if [ "$starting" = "$TARGET_DRIVER" ]; then
            change_required=false
          else
            change_required=true
          fi

          echo "starting=$starting" >> "$GITHUB_OUTPUT"
          echo "change_required=$change_required" >> "$GITHUB_OUTPUT"

          echo "::notice::Starting session driver: $starting. Requested target: $TARGET_DRIVER. Change required: $change_required."

      # THIS WORKFLOW MUST NEVER CLOSE A WINDOW IT DID NOT OPEN.
      #
      # `php artisan up` releases whatever maintenance mode is in effect. If a
      # deployment, or a person part-way through an operation, already has the
      # site down, then opening "our" window and closing it later would end
      # somebody else's outage on their behalf - and put a half-finished
      # operation in front of users.
      #
      # The application is asked directly. An HTTP 503 would be a guess: a
      # proxy, a WAF or a cached response can produce one without the
      # application being down at all, and a custom maintenance response can
      # look like a 200.
      - name: Refuse if production is already in maintenance
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail

          state="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan tinker --execute='echo app()->isDownForMaintenance() ? \"MAINTENANCE\" : \"LIVE\";'" \
            | tr -d '[:space:]')"

          case "$state" in
            LIVE)
              echo "::notice::Production is serving normally. This run may open its own maintenance window."
              ;;
            MAINTENANCE)
              echo "::error::Production is ALREADY in maintenance mode, so that window belongs to another operation. Refusing to change SESSION_DRIVER, and refusing to run 'php artisan up' on a window this workflow did not open. Establish what is in progress before dispatching again."
              exit 1
              ;;
            *)
              echo "::error::Could not establish whether production is in maintenance mode. Refusing to proceed."
              exit 1
              ;;
          esac

      # ▸ FROM HERE THE SITE IS DARK. ▸
      #
      # `opened` is written only after `artisan down` has actually succeeded,
      # and it is the sole record of ownership the recovery step trusts.
      - name: Open the maintenance window
        id: maintenance
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan down --retry=60"

          echo "opened=true" >> "$GITHUB_OUTPUT"
          echo "::notice::This run opened the maintenance window and therefore owns it."

      # ▸ POINT OF NO RETURN ▸
      #
      # The script is piped over stdin. It takes the deployment path and the
      # target driver and nothing else - no key name, no key=value pair, no
      # flag. Everything it guarantees is in the script and tested for real in
      # tests/Architecture/SessionDriverDeploymentTest.php.
      - name: Align SESSION_DRIVER
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "sh -s -- \"$CPANEL_DEPLOY_PATH\" \"$TARGET_DRIVER\"" \
            < deployment/ensure-session-driver.sh

      - name: Clear compiled caches
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan optimize:clear --no-interaction"

      # The script reporting success says the FILE was written. This says the
      # APPLICATION is running the requested driver, which is the claim that
      # matters and is not the same claim.
      - name: Verify the effective driver is the requested target
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail

          effective="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan tinker --execute='echo (string) config(\"session.driver\");'" \
            | tr -d '[:space:]')"

          if [ "$effective" != "$TARGET_DRIVER" ]; then
            echo "::error::The effective session driver is [$effective], not the requested [$TARGET_DRIVER]."
            exit 1
          fi

          echo "::notice::Effective session driver: $effective."

      - name: Verify application health over SSH
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan semantiq:health"

      # Only now, and only if this run is the window's owner. The condition is
      # deliberately ownership rather than change_required: they happen to agree
      # today, and the one that is actually being claimed is ownership.
      - name: Close the maintenance window
        if: steps.maintenance.outputs.opened == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan up"

      - name: Verify the site over HTTPS
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail
          # Cache-busted: a cached 200 from an earlier state would read as a pass.
          code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/?align=${GITHUB_RUN_ID}")"
          [ "$code" = "200" ] || { echo "::error::Site root returned $code"; exit 1; }

          up="$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/up?align=${GITHUB_RUN_ID}")"
          [ "$up" = "ok" ] || { echo "::error::/up returned [$up]"; exit 1; }

          echo "::notice::Site root 200 and /up ok on session driver $TARGET_DRIVER."

      - name: Report what was done
        if: steps.plan.outputs.change_required == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Session driver alignment"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Starting driver | \`${{ steps.plan.outputs.starting }}\` |"
            echo "| Requested target | \`$TARGET_DRIVER\` |"
            echo "| Effective driver now | \`$TARGET_DRIVER\` |"
            echo "| Every signed-in user | signed out - the expected, accepted effect |"
            echo "| Rollback | re-run this workflow with target \`file\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # THE NO-OP PATH. Nothing was opened, nothing was written, nobody was
      # interrupted - and this report says exactly that rather than reusing the
      # change report's language.
      - name: Report that no change was required
        if: steps.plan.outputs.change_required != 'true'
        run: |
          set -euo pipefail
          echo "::notice::Production is already running session driver [$TARGET_DRIVER]. Nothing was changed."
          {
            echo "### Session driver alignment - no change required"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Driver before this run | \`${{ steps.plan.outputs.starting }}\` |"
            echo "| Requested target | \`$TARGET_DRIVER\` |"
            echo "| Action taken | **none** |"
            echo "| Maintenance window | **not opened** |"
            echo "| .env | **not read for modification, not written** |"
            echo "| Existing logins | **not interrupted** |"
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL CLOSED, AND SAY WHICH SIDE OF THE MUTATION THE FAILURE LANDED ON.
      #
      # This runs only on failure. It makes NO assumption about where in the
      # sequence the failure happened - a failure can land before the window
      # opened, between the rewrite and the verification, or after `artisan up`
      # has already put the site back in front of users. So it reads the
      # effective driver rather than inferring it from which step failed, and it
      # reads the maintenance state rather than announcing one.
      #
      # `php artisan down` is idempotent - Laravel reports "Application is
      # already down" and exits 0 - so running it in the changed-driver branch
      # is correct whether or not the window was ever closed.
      - name: Establish the exact state after a failure
        if: failure()
        run: |
          set -uo pipefail

          starting="${{ steps.plan.outputs.starting }}"
          we_opened="${{ steps.maintenance.outputs.opened }}"

          remote() {
            ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
              "$CPANEL_USER@$CPANEL_HOST" "cd \"$CPANEL_DEPLOY_PATH\" && $1"
          }

          if [ -z "$starting" ]; then
            echo "::error::The run failed before the starting driver was established. Production configuration was not touched, and no maintenance window was opened by this run."
            exit 1
          fi

          remote "php artisan optimize:clear --no-interaction" >/dev/null 2>&1 || true

          effective="$(remote "php artisan tinker --execute='echo (string) config(\"session.driver\");'" 2>/dev/null | tr -d '[:space:]')" || effective=''

          if [ -z "$effective" ]; then
            echo "::error::CRITICAL - the run failed and the effective session driver could NOT be read, so the state of production is UNKNOWN. Verify the application over SSH IMMEDIATELY. Do not dispatch this workflow again until you have."
            exit 1
          fi

          if [ "$effective" = "$starting" ]; then
            echo "::notice::The session driver is still [$effective]. Nothing was changed."

            # OWNERSHIP, NOT OPTIMISM. `artisan up` would release whatever
            # maintenance mode is in effect, including one that belongs to
            # somebody else's operation.
            if [ "$we_opened" = "true" ]; then
              if remote "php artisan up"; then
                echo "::notice::The maintenance window THIS RUN opened has been closed. Production is unchanged and serving."
              else
                echo "::error::This run opened a maintenance window and could not close it. Run 'php artisan up' over SSH."
              fi
            else
              echo "::notice::This run did not open a maintenance window, so none was closed. Any maintenance mode in effect belongs to another operation and has been left alone."
            fi

            echo "::error::The alignment failed with production unchanged on session driver [$effective]."
            exit 1
          fi

          # THE DRIVER CHANGED. The site must not be serving an unverified
          # deployment, wherever the failure landed - including after the normal
          # close step had already run.
          echo "::notice::The session driver was changed from [$starting] to [$effective] and the run then failed. Putting production back into maintenance before reporting."

          remote "php artisan down --retry=60" >/dev/null 2>&1 || true

          state="$(remote "php artisan tinker --execute='echo app()->isDownForMaintenance() ? \"MAINTENANCE\" : \"LIVE\";'" 2>/dev/null | tr -d '[:space:]')" || state=''

          if [ "$state" = "MAINTENANCE" ]; then
            echo "::error::The session driver was changed from [$starting] to [$effective] and the run failed. Production has been PUT BACK INTO MAINTENANCE rather than left serving an unverified deployment, and the application confirms it is down. To roll back, dispatch this workflow from main with target [$starting]. To go forward, fix the failure and re-run."
            exit 1
          fi

          echo "::error::CRITICAL - the session driver was changed from [$starting] to [$effective], the run failed, AND MAINTENANCE MODE COULD NOT BE GUARANTEED. Production may be serving an unverified deployment right now. Verify the application state over SSH IMMEDIATELY, before anything else."
          exit 1
