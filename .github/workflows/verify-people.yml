# Read-only P1-03 people state verification.
#
# Manual dispatch only. It reports, for every user, ONLY what the product itself
# already considers safe to put on a screen:
#
#   - the MASKED Object ID, through IdentitySafeValue - the same D-27/D-37
#     masking the record page uses, first 8 and last 4 characters;
#   - whether they hold the System Administrator role;
#   - active or inactive;
#   - whether they have ever signed in;
#   - whether an organisation is assigned.
#
# NO name, NO email, NO full identifier, NO tenant value is read or printed.
# The masked Object ID is enough to identify an account in the Microsoft Entra
# admin centre, which is the question this workflow exists to answer, and not
# enough to be an identifier in a CI log.
#
# It exists because "access-not-assigned" deliberately covers BOTH an unknown
# identity and an inactive account - the two are indistinguishable to the person
# signing in, on purpose - so when somebody cannot get in, the only honest way
# to tell those apart is to look at the state directly.
name: Verify P1-03 people state (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Report people state over SSH
    runs-on: ubuntu-latest
    environment: development

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          : "${CPANEL_SSH_PRIVATE_KEY:?CPANEL_SSH_PRIVATE_KEY secret is required}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?CPANEL_SSH_KEY_PASSPHRASE secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/cpanel_deploy_key </dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      # Masked identifiers, booleans and counts. Nothing else leaves the server.
      - name: Report people state
        run: |
          set -euo pipefail

          out="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" "cd \"$CPANEL_DEPLOY_PATH\" && php artisan tinker --execute='
              \$users = [];
              foreach (\App\Modules\Platform\Models\User::query()->orderBy(\"id\")->get() as \$u) {
                \$users[] = [
                  \"object_id_masked\" => \App\Modules\Identity\Support\IdentitySafeValue::masked(\$u->external_subject),
                  \"is_system_administrator\" => \$u->isSystemAdministrator(),
                  \"status\" => \$u->status->value,
                  \"has_ever_signed_in\" => \$u->last_signed_in_at !== null,
                  \"organisation_assigned\" => \$u->belongsToOrganisation(),
                ];
              }

              echo json_encode([
                \"users\" => \$users,
                \"users_total\" => count(\$users),
                \"active_system_admins\" => \App\Modules\Platform\Models\User::query()->activeSystemAdministrators()->count(),
                \"groups_total\" => \App\Modules\People\Models\Group::query()->count(),
                \"group_memberships_total\" => \App\Modules\People\Models\GroupMembership::query()->count(),
                \"group_memberships_current\" => \App\Modules\People\Models\GroupMembership::query()->whereNull(\"left_at\")->count(),
              ], JSON_PRETTY_PRINT), PHP_EOL;'")"

          echo "$out"

          # A guard, not just a report. An unmasked Object ID is 36 characters
          # with four hyphens; a masked one is 13 with an ellipsis. If anything
          # of the full shape appears, something printed an identifier.
          if printf '%s' "$out" | grep -qiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::The report contains a full Object ID. Refusing to leave it in the log."
            exit 1
          fi

          # An email would be the other way this leaks.
          if printf '%s' "$out" | grep -qE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'; then
            echo "::error::The report contains an email address. Refusing to leave it in the log."
            exit 1
          fi

          # THE POINT OF THE WHOLE WORKFLOW: exactly one active administrator.
          # Zero means the deployment cannot be administered and bootstrap will
          # not reopen, which is the condition P1-03's lockout guard exists to
          # prevent. Reported as an error rather than left for a reader to spot.
          admins="$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.loads(sys.stdin.read()).get("active_system_admins", -1))')"

          if [ "$admins" -lt 1 ]; then
            echo "::error::There are ${admins} active System Administrators. The deployment cannot be administered."
            exit 1
          fi

          echo "::notice::People state reported. Masked identifiers, booleans and counts only; no name, email or full identifier was read."
