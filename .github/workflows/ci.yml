# Automated checks on every pull request, and on main after a merge.
#
# Separate from deploy.yml on purpose. That workflow installs with --no-dev,
# which strips PHPUnit and Pint out of the vendor directory, so it could not run
# these checks even if a step were added to it. It also fires on the same push
# that deploys, so a failure there is discovered after the deployment has already
# started.
#
# This workflow is the gate before that point. It never touches the server and
# holds no deployment secret.
name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pint, PHPUnit and MySQL migrations
    runs-on: ubuntu-latest

    # Migrations are proven against real MySQL, not only the SQLite the suite
    # runs on. A construct MySQL rejects - an over-long index identifier, most
    # recently - then fails here rather than during a deployment.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: semantiq_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Blade renders @vite, which reads public/build/manifest.json. That
      # directory is gitignored, so it exists on a developer machine that has
      # built once and never on a clean runner. Without this step the feature
      # tests fail with a 500 that reads like an application bug.
      - name: Build frontend assets
        run: npm run build

      - name: Prepare the test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      # The suite runs on SQLite. This proves the same migrations apply to the
      # engine production actually uses.
      - name: Run migrations against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semantiq_ci
          DB_USERNAME: root
          DB_PASSWORD: ci-root
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate:status

          # And prove down() works, on the engine that has to run it.
          #
          # A down() is only ever needed on the day something has to be undone,
          # which is the worst possible day to discover it is broken. It is also
          # invisible to the suite: SQLite cannot drop a foreign key by name at
          # all, so a rollback that MySQL would accept fails locally and a
          # rollback that MySQL would REJECT looks identical.
          #
          # Rolled back and re-applied, so the database is left where the rest of
          # the job expects it.
          php artisan migrate:rollback --force --no-interaction --step=1
          php artisan migrate --force --no-interaction
          php artisan migrate:status

      # The People suite again, on MySQL.
      #
      # Two P1-03 guards are about behaviour SQLite cannot express. The locking
      # read that stops two concurrent deactivations leaving zero System
      # Administrators compiles to NOTHING under SQLite's grammar, so the
      # assertion that it carries FOR UPDATE can only run here - on the engine
      # production uses. The suite above skips it and says so; this step is
      # where it actually fires.
      - name: Run the People suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semantiq_ci
          DB_USERNAME: root
          DB_PASSWORD: ci-root
        run: |
          set -eo pipefail

          php artisan test tests/Feature/People | tee people-mysql.log

          # A PATH THAT MATCHES NOTHING EXITS 0.
          #
          # `php artisan test tests/Feature/Typo` prints "Test file not found"
          # and returns success, so a rename or a moved directory would leave
          # this step permanently green while running no tests at all - a step
          # that reports safety it is not providing, which is the one thing
          # CLAUDE.md §2 forbids. So the count is asserted, not assumed.
          passed=$(grep -oE '[0-9]+ passed' people-mysql.log | head -1 | grep -oE '[0-9]+' || echo 0)

          if [ "${passed:-0}" -lt 40 ]; then
            echo "::error::Only ${passed:-0} People tests ran against MySQL. The suite is larger than that, so the path matched little or nothing."
            exit 1
          fi

          echo "${passed} People tests passed against MySQL 8.4."


      # The Domains suite on MySQL, and this one is not optional.
      #
      # P1-04's serialisation boundary is a row lock on business_domains, and
      # SQLite HAS NO SELECT ... FOR UPDATE - the locking reads compile away
      # entirely there. DomainConcurrencyTest's lock cases skip on SQLite with a
      # stated reason rather than passing vacuously, so THIS IS THE ONLY PLACE
      # THEY EVER FIRE. A green suite without this step would be reporting
      # safety it has not checked.
      - name: Run the Domains suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semantiq_ci
          DB_USERNAME: root
          DB_PASSWORD: ci-root
        run: |
          set -eo pipefail

          php artisan test tests/Feature/Domains | tee domains-mysql.log

          # A PATH THAT MATCHES NOTHING EXITS 0, so the count is asserted.
          passed=$(grep -oE '[0-9]+ passed' domains-mysql.log | head -1 | grep -oE '[0-9]+' || echo 0)

          if [ "${passed:-0}" -lt 40 ]; then
            echo "::error::Only ${passed:-0} Domains tests ran against MySQL. The suite is larger than that, so the path matched little or nothing."
            exit 1
          fi

          # AND THE CONCURRENCY CASES ACTUALLY RAN. On SQLite they skip; here
          # they must not, and a skip in this step means the lock guard was
          # never exercised on any engine at all.
          if grep -qiE 'skipped|SQLite has no SELECT' domains-mysql.log; then
            echo "::error::A Domains test skipped on MySQL. The concurrency cases skip only on SQLite, so this step just failed to prove the row lock exists."
            exit 1
          fi

          echo "${passed} Domains tests passed against MySQL 8.4, concurrency cases included."


      # deploy.yml stages files that live outside the application tree, so
      # nothing in the test suite touches them. Deleting one is invisible until a
      # deployment fails - which is what happened when the repository was cleaned
      # and deployment/public_html.htaccess went with it: seven consecutive
      # deploys failed at the same step before anyone looked.
      - name: Check the files deploy.yml depends on
        run: |
          missing=0
          for f in deployment/public_html.htaccess deployment/public_html.index.php deployment/rsync-protected-paths.txt deployment/ensure-app-key.sh deployment/ensure-session-lifetime.sh; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required by .github/workflows/deploy.yml but missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
