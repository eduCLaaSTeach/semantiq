# Deploy to cPanel over SSH.
#
# Two deployment states, per correction 1. The first P1-BASE deployment finds no
# Laravel installation on the server, so "artisan down" would fail and abort the
# pipeline before it could install the application that would have made the
# command work. Detection is an explicit probe, and a broken prior installation
# resolves to INITIAL rather than to an error - a half-installed server must
# never block installing its replacement.
name: Deploy to cPanel (SSH)

on:
  push:
    branches: main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and sync to cPanel over SSH
    runs-on: ubuntu-latest
    environment: development

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      APP_URL: https://semantiq.claas2saas.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Remove node_modules before deployment
        run: rm -rf node_modules

      - name: Stage the public_html forwarder
        run: cp deployment/public_html.htaccess .htaccess

      # Correction 3. The exclusion contract is enforced here, on the runner,
      # before anything is transferred. A missing entry fails the job rather than
      # deleting a file that exists nowhere else. A CI test makes the same
      # assertion on every pull request so it rarely gets this far.
      - name: Assert the rsync exclusion contract
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r path; do
            case "$path" in ''|\#*) continue ;; esac
            if ! grep -q -- "--exclude \"$path\"" "$GITHUB_WORKFLOW_REF_FILE"; then
              echo "::error::Protected path [$path] is not excluded in the rsync command."
              missing=1
            fi
          done < deployment/rsync-protected-paths.txt
          [ "$missing" -eq 0 ] || exit 1
        env:
          GITHUB_WORKFLOW_REF_FILE: .github/workflows/deploy.yml

      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          : "${CPANEL_SSH_PRIVATE_KEY:?CPANEL_SSH_PRIVATE_KEY secret is required}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?CPANEL_SSH_KEY_PASSPHRASE secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/cpanel_deploy_key </dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && pwd && command -v rsync && rsync --version | head -n 1"

      # A directory existing is not evidence of a working installation. All four
      # markers must hold, and anything else resolves to INITIAL.
      - name: Detect the installation state
        id: state
        run: |
          set -euo pipefail
          state="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" 2>/dev/null || exit 0; \
             [ -f artisan ] && [ -f vendor/autoload.php ] && [ -f bootstrap/app.php ] \
               && php artisan --version >/dev/null 2>&1 && echo EXISTING || true")"
          state="${state:-INITIAL}"
          [ "$state" = "EXISTING" ] || state="INITIAL"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployment state: $state"

      - name: Open the maintenance window
        if: steps.state.outputs.state == 'EXISTING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan down --retry=60"

      # --delete removes stale files, including the obsolete deploy-test
      # index.html at the document root. Every protected path is excluded, and an
      # exclusion protects against deletion as well as transfer - that is the
      # safety mechanism, asserted above before this runs.
      - name: Sync files to cPanel
        run: |
          set -euo pipefail
          rsync -az --delete --human-readable --itemize-changes \
            -e "ssh -i ~/.ssh/cpanel_deploy_key -p $CPANEL_PORT -o IdentitiesOnly=yes -o BatchMode=yes" \
            --exclude ".env" \
            --exclude ".well-known/" \
            --exclude "storage/" \
            --exclude "public/storage" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "deployment/" \
            --exclude "node_modules/" \
            --exclude "tests/" \
            --exclude "phpunit.xml" \
            --exclude "doc/" \
            --exclude "*.md" \
            --exclude ".editorconfig" \
            --exclude ".gitignore" \
            --exclude ".gitattributes" \
            --exclude ".env.example" \
            ./ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_DEPLOY_PATH/"

      # Permanent security control. Under D-08B this one file IS the security
      # boundary, so every claim about what is protected rests on the server
      # copy being the copy under version control. Reviewing the repository file
      # proves nothing about what Apache actually reads.
      #
      # Introduced with the denial diagnostics and kept deliberately: it is what
      # makes the exposure gate below meaningful, and it catches a hand-edit on
      # the server - which is exactly the change nobody would otherwise notice.
      # A mismatch fails the deployment.
      #
      # Hashes only. No file content is printed.
      - name: Verify the deployed .htaccess matches the repository copy
        run: |
          set -euo pipefail

          expected="$(sha256sum deployment/public_html.htaccess | cut -d' ' -f1)"

          actual="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && { sha256sum .htaccess 2>/dev/null || shasum -a 256 .htaccess 2>/dev/null || openssl dgst -sha256 .htaccess 2>/dev/null; } | grep -oE '[0-9a-f]{64}' | head -1")"

          echo "expected (repository) : ${expected:-<none>}"
          echo "actual   (server)     : ${actual:-<none>}"

          if [ -z "$actual" ]; then
            echo "::error::Could not read a checksum for the deployed .htaccess."
            exit 1
          fi

          if [ "$expected" != "$actual" ]; then
            echo "::error::The deployed .htaccess does NOT match deployment/public_html.htaccess."
            exit 1
          fi

          echo "::notice::.htaccess integrity verified - the deployed file is the repository file."

      - name: Ensure runtime directories exist and are writable
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache"

      # The server .env is created by the one-time provisioning of D-05 and is
      # never transferred.
      #
      # APP_KEY is bootstrapped here, and only here. The provisioning writes
      # .env by hand, a Laravel key cannot be written by hand, and before the
      # first deployment there is no remote artisan to generate one - so a check
      # that simply refused an empty key could never be satisfied. This step runs
      # after the sync, so the application it needs is already present.
      #
      # On an UPDATE deployment an existing key is mandatory and is never
      # regenerated: rotating it invalidates every encrypted cookie and session.
      # The logic lives in a script so it can be tested for real rather than
      # asserted about; see tests/Architecture/AppKeyBootstrapTest.php. It is
      # piped over stdin because deployment/ is excluded from rsync and has no
      # business on the host.
      - name: Verify the environment and bootstrap APP_KEY if this is the first deployment
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "sh -s -- \"$CPANEL_DEPLOY_PATH\" \"${{ steps.state.outputs.state }}\"" \
            < deployment/ensure-app-key.sh

      # Migration failure fails the deployment. On the EXISTING path the
      # application stays in maintenance: artisan up does not run after this, and
      # no rollback migration is triggered automatically, because a destructive
      # down() over a half-applied migration can lose data the failure did not.
      - name: Run database migrations
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan migrate --force --no-interaction"

      - name: Clear compiled caches
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan optimize:clear --no-interaction"

      - name: Verify application health over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan semantiq:health"

      - name: Close the maintenance window
        if: steps.state.outputs.state == 'EXISTING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan up"

      - name: Verify the site over HTTPS
        run: |
          set -euo pipefail
          # Cache-busted: a cached 200 from an earlier state would read as a pass.
          code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/?deploy=${GITHUB_SHA}")"
          [ "$code" = "200" ] || { echo "::error::Site root returned $code"; exit 1; }

          up="$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/up?deploy=${GITHUB_SHA}")"
          [ "$up" = "ok" ] || { echo "::error::/up returned [$up]"; exit 1; }

          echo "::notice::Site root 200 and /up ok."

      # Correction: a redirect is not proof. A 302 means the request reached the
      # application; the requirement is that these files are never served.
      # The live security gate. Under D-08B the Laravel tree sits inside the
      # document root, so this is the check that the boundary is real - not a
      # convention, not a code review, an observed HTTPS response.
      #
      # It requires 403, not "403 or 404".
      #
      # Those two used to be treated as equally acceptable, because a 404 was
      # believed to be the best this host could produce. PR #38 disproved that:
      # Apache does deny at the document root, by four independent mechanisms,
      # and the 404s were a path-valued ErrorDocument masking the 403 by
      # re-entering the rewrite chain. With the literal ErrorDocument in place
      # the true status is visible, so a 404 here now means something specific
      # and bad: the request fell THROUGH the Apache boundary into Laravel, and
      # the deny rule that should have stopped it did not. That is a regression
      # in the security boundary and it fails the deployment.
      - name: Web-exposure negative tests
        run: |
          set -euo pipefail
          failed=0

          # Every path here is owned by the Apache boundary in
          # deployment/public_html.htaccess. All were observed returning 403 in
          # production before this gate was tightened, so a 404 is a real
          # regression rather than an untested expectation.
          for path in \
            ".env" ".env.example" ".gitignore" ".git/config" \
            "composer.json" "composer.lock" "package.json" "package-lock.json" \
            "artisan" "phpunit.xml" "vite.config.js" \
            "app/" "bootstrap/" "config/" "database/" "resources/" "routes/" \
            "storage/" "tests/" "vendor/" "deployment/" "doc/" \
            "README.md" "deployment/public_html.htaccess" "storage/logs/laravel.log"
          do
            code="$(curl -s -o /tmp/body -w '%{http_code}' "$APP_URL/$path?cb=${GITHUB_SHA}")"
            case "$code" in
              403) ;;
              404)
                echo "::error::$path returned 404. The Apache deny rule did not fire and the request reached Laravel; the security boundary is no longer observable."
                failed=1 ;;
              *)
                echo "::error::$path returned $code; 403 required (a redirect is not proof)"
                failed=1 ;;
            esac

            # A 403 that still leaks something in its body is not a pass. The
            # denial response must reveal no secret, connection string, server
            # path, stack trace or framework internals.
            if grep -qE 'APP_KEY|DB_DATABASE|DB_USERNAME|DB_PASSWORD|MICROSOFT_CLIENT_SECRET|mysql://|/home/[a-z0-9]+/public_html' /tmp/body 2>/dev/null; then
              echo "::error::$path response contained a secret marker, connection string or server path"; failed=1
            fi
            if grep -qE '<\?php|Stack trace:|vendor/laravel|Illuminate\\\\|Whoops' /tmp/body 2>/dev/null; then
              echo "::error::$path response leaked PHP source, a stack trace or framework internals"; failed=1
            fi
          done

          # The denial body itself must stay bare. If someone points
          # ErrorDocument 403 at a path, Apache re-enters the rewrite chain and
          # the masking returns - so assert the shape of what a denial returns,
          # not just its status.
          curl -s -o /tmp/deny -m 20 "$APP_URL/.env?cb=${GITHUB_SHA}" || true
          deny_bytes="$(wc -c < /tmp/deny | tr -d ' ')"
          echo "denial body: ${deny_bytes} bytes"
          if [ "${deny_bytes:-0}" -gt 512 ]; then
            echo "::error::The 403 body is ${deny_bytes} bytes. A bare denial is expected; this looks like a rendered page, which suggests ErrorDocument is resolving through the application again."
            failed=1
          fi

          # .well-known must stay reachable or TLS renewal breaks silently.
          wk="$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/.well-known/")"
          case "$wk" in 403) echo "::error::.well-known/ is blocked; ACME renewal will fail"; failed=1 ;; esac

          # The application must still be alive. A boundary that denies
          # everything, including the site, is not a passing state.
          for pair in "/:200" "/up:200"; do
            p="${pair%:*}"; want="${pair##*:}"
            got="$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL$p?cb=${GITHUB_SHA}")"
            [ "$got" = "$want" ] || { echo "::error::$p returned $got, expected $want"; failed=1; }
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "::notice::Web-exposure gate passed: every protected path returned 403 from Apache."
