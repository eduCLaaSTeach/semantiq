# Deploy to cPanel over SSH.
#
# Two deployment states, per correction 1. The first P1-BASE deployment finds no
# Laravel installation on the server, so "artisan down" would fail and abort the
# pipeline before it could install the application that would have made the
# command work. Detection is an explicit probe, and a broken prior installation
# resolves to INITIAL rather than to an error - a half-installed server must
# never block installing its replacement.
name: Deploy to cPanel (SSH)

on:
  push:
    branches: main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and sync to cPanel over SSH
    runs-on: ubuntu-latest
    environment: development

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      APP_URL: https://semantiq.claas2saas.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Remove node_modules before deployment
        run: rm -rf node_modules

      - name: Stage the public_html forwarder
        run: cp deployment/public_html.htaccess .htaccess

      # Correction 3. The exclusion contract is enforced here, on the runner,
      # before anything is transferred. A missing entry fails the job rather than
      # deleting a file that exists nowhere else. A CI test makes the same
      # assertion on every pull request so it rarely gets this far.
      - name: Assert the rsync exclusion contract
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r path; do
            case "$path" in ''|\#*) continue ;; esac
            if ! grep -q -- "--exclude \"$path\"" "$GITHUB_WORKFLOW_REF_FILE"; then
              echo "::error::Protected path [$path] is not excluded in the rsync command."
              missing=1
            fi
          done < deployment/rsync-protected-paths.txt
          [ "$missing" -eq 0 ] || exit 1
        env:
          GITHUB_WORKFLOW_REF_FILE: .github/workflows/deploy.yml

      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          : "${CPANEL_SSH_PRIVATE_KEY:?CPANEL_SSH_PRIVATE_KEY secret is required}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?CPANEL_SSH_KEY_PASSPHRASE secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/cpanel_deploy_key </dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && pwd && command -v rsync && rsync --version | head -n 1"

      # A directory existing is not evidence of a working installation. All four
      # markers must hold, and anything else resolves to INITIAL.
      - name: Detect the installation state
        id: state
        run: |
          set -euo pipefail
          state="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" 2>/dev/null || exit 0; \
             [ -f artisan ] && [ -f vendor/autoload.php ] && [ -f bootstrap/app.php ] \
               && php artisan --version >/dev/null 2>&1 && echo EXISTING || true")"
          state="${state:-INITIAL}"
          [ "$state" = "EXISTING" ] || state="INITIAL"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployment state: $state"

      - name: Open the maintenance window
        if: steps.state.outputs.state == 'EXISTING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan down --retry=60"

      # --delete removes stale files, including the obsolete deploy-test
      # index.html at the document root. Every protected path is excluded, and an
      # exclusion protects against deletion as well as transfer - that is the
      # safety mechanism, asserted above before this runs.
      - name: Sync files to cPanel
        run: |
          set -euo pipefail
          rsync -az --delete --human-readable --itemize-changes \
            -e "ssh -i ~/.ssh/cpanel_deploy_key -p $CPANEL_PORT -o IdentitiesOnly=yes -o BatchMode=yes" \
            --exclude ".env" \
            --exclude ".well-known/" \
            --exclude "storage/" \
            --exclude "public/storage" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "deployment/" \
            --exclude "node_modules/" \
            --exclude "tests/" \
            --exclude "phpunit.xml" \
            --exclude "doc/" \
            --exclude "*.md" \
            --exclude ".editorconfig" \
            --exclude ".gitignore" \
            --exclude ".gitattributes" \
            --exclude ".env.example" \
            ./ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_DEPLOY_PATH/"

      # Fact A of the diagnostic: prove the .htaccess on the server is the one
      # under version control. Every claim about the security boundary rests on
      # that file, and until now nothing checked that what we reason about is
      # what Apache actually reads. A mismatch fails the deployment.
      #
      # Hashes only. No file content is printed.
      - name: Verify the deployed .htaccess matches the repository copy
        run: |
          set -euo pipefail

          expected="$(sha256sum deployment/public_html.htaccess | cut -d' ' -f1)"

          actual="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && { sha256sum .htaccess 2>/dev/null || shasum -a 256 .htaccess 2>/dev/null || openssl dgst -sha256 .htaccess 2>/dev/null; } | grep -oE '[0-9a-f]{64}' | head -1")"

          echo "expected (repository) : ${expected:-<none>}"
          echo "actual   (server)     : ${actual:-<none>}"

          if [ -z "$actual" ]; then
            echo "::error::Could not read a checksum for the deployed .htaccess."
            exit 1
          fi

          if [ "$expected" != "$actual" ]; then
            echo "::error::The deployed .htaccess does NOT match deployment/public_html.htaccess."
            exit 1
          fi

          echo "::notice::.htaccess integrity verified - the deployed file is the repository file."

      - name: Ensure runtime directories exist and are writable
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache"

      # The server .env is created by the one-time provisioning of D-05 and is
      # never transferred.
      #
      # APP_KEY is bootstrapped here, and only here. The provisioning writes
      # .env by hand, a Laravel key cannot be written by hand, and before the
      # first deployment there is no remote artisan to generate one - so a check
      # that simply refused an empty key could never be satisfied. This step runs
      # after the sync, so the application it needs is already present.
      #
      # On an UPDATE deployment an existing key is mandatory and is never
      # regenerated: rotating it invalidates every encrypted cookie and session.
      # The logic lives in a script so it can be tested for real rather than
      # asserted about; see tests/Architecture/AppKeyBootstrapTest.php. It is
      # piped over stdin because deployment/ is excluded from rsync and has no
      # business on the host.
      - name: Verify the environment and bootstrap APP_KEY if this is the first deployment
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "sh -s -- \"$CPANEL_DEPLOY_PATH\" \"${{ steps.state.outputs.state }}\"" \
            < deployment/ensure-app-key.sh

      # Migration failure fails the deployment. On the EXISTING path the
      # application stays in maintenance: artisan up does not run after this, and
      # no rollback migration is triggered automatically, because a destructive
      # down() over a half-applied migration can lose data the failure did not.
      - name: Run database migrations
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan migrate --force --no-interaction"

      - name: Clear compiled caches
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan optimize:clear --no-interaction"

      - name: Verify application health over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan semantiq:health"

      - name: Close the maintenance window
        if: steps.state.outputs.state == 'EXISTING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan up"

      - name: Verify the site over HTTPS
        run: |
          set -euo pipefail
          # Cache-busted: a cached 200 from an earlier state would read as a pass.
          code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/?deploy=${GITHUB_SHA}")"
          [ "$code" = "200" ] || { echo "::error::Site root returned $code"; exit 1; }

          up="$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/up?deploy=${GITHUB_SHA}")"
          [ "$up" = "ok" ] || { echo "::error::/up returned [$up]"; exit 1; }

          echo "::notice::Site root 200 and /up ok."

      # Correction: a redirect is not proof. A 302 means the request reached the
      # application; the requirement is that these files are never served.
      - name: Web-exposure negative tests
        run: |
          set -euo pipefail
          failed=0
          # The Gate 4 minimum list, in full.
          for path in \
            ".env" ".git/config" \
            "composer.json" "composer.lock" "package.json" "package-lock.json" \
            "artisan" "phpunit.xml" "vite.config.js" \
            "app/" "bootstrap/" "config/" "database/" "resources/" "routes/" \
            "storage/" "tests/" "vendor/" "deployment/" "doc/" \
            "README.md" "deployment/public_html.htaccess" "storage/logs/laravel.log"
          do
            code="$(curl -s -o /tmp/body -w '%{http_code}' "$APP_URL/$path?cb=${GITHUB_SHA}")"
            case "$code" in
              403|404) ;;
              *) echo "::error::$path returned $code; expected 403 or 404 (a redirect is not proof)"; failed=1 ;;
            esac
            # Secret markers, connection strings and server paths. A 403 or 404
            # that still returns a body carrying any of these is a failure.
            if grep -qE 'APP_KEY|DB_DATABASE|DB_USERNAME|DB_PASSWORD|MICROSOFT_CLIENT_SECRET|mysql://|/home/[a-z0-9]+/public_html' /tmp/body 2>/dev/null; then
              echo "::error::$path response contained a secret marker, connection string or server path"; failed=1
            fi
          done

          # .well-known must stay reachable or TLS renewal breaks silently.
          wk="$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/.well-known/")"
          case "$wk" in 403) echo "::error::.well-known/ is blocked; ACME renewal will fail"; failed=1 ;; esac

          [ "$failed" -eq 0 ] || exit 1
          echo "::notice::Web-exposure negative tests passed."

      # =================================================================
      # TEMPORARY DIAGNOSTIC - Apache denial-capability matrix
      # =================================================================
      # One authorised diagnostic, three independent mechanisms, measured in a
      # single request cycle against one server state.
      #
      # It runs AFTER the exposure suite so it cannot influence those results,
      # and it changes no application behaviour: a deny rule only ever denies
      # more, and every probe path is synthetic.
      #
      # The step does not fail the deployment on a negative result. A negative
      # is the answer to the question being asked, and what follows from it is
      # the product owner's decision, not this workflow's.
      - name: Apache denial-capability matrix (diagnostic)
        run: |
          set -uo pipefail

          SSH="ssh -i $HOME/.ssh/cpanel_deploy_key -p $CPANEL_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 $CPANEL_USER@$CPANEL_HOST"

          deny_file="$CPANEL_DEPLOY_PATH/public/__semantiq_files_deny_probe.txt"
          ctrl_file="$CPANEL_DEPLOY_PATH/public/__semantiq_files_control_probe.txt"

          # Cleanup runs on every exit path - success, failure, or the runner
          # cancelling the job - because a public diagnostic file left behind is
          # a worse outcome than an unanswered question. rsync --delete on the
          # next deployment is the backstop: neither file is in the repository.
          cleanup() {
            echo "--- cleanup ---"
            $SSH "rm -f '$deny_file' '$ctrl_file'" \
              || echo "::error::Could not remove the diagnostic probe files over SSH."
            # An explicit marker, not a parsed count: an SSH login banner on
            # stdout would turn a count into garbage and report a clean server
            # as dirty, or worse, the reverse.
            verify="$($SSH "if [ -e '$deny_file' ] || [ -e '$ctrl_file' ]; then echo SEMANTIQ_PROBE_PRESENT; else echo SEMANTIQ_PROBE_ABSENT; fi" 2>/dev/null)"
            case "$verify" in
              *SEMANTIQ_PROBE_ABSENT*)
                echo "::notice::Diagnostic probe files removed from the server." ;;
              *SEMANTIQ_PROBE_PRESENT*)
                echo "::error::Diagnostic probe files are STILL on the server. Remove them; the next deployment's rsync --delete is the backstop." ;;
              *)
                echo "::warning::Could not verify probe file removal over SSH. The next deployment's rsync --delete will remove them, as neither file is in the repository." ;;
            esac
          }
          trap cleanup EXIT

          # Mechanism C needs a file that is GENUINELY SERVED when the deny
          # fails, otherwise its negative result is indistinguishable from the
          # path simply not existing. Both files go inside public/, where the
          # forwarder resolves them; one is covered by <Files> + Require all
          # denied, the sibling is not.
          echo "--- creating diagnostic files ---"
          if ! $SSH "printf 'SEMANTIQ_DENY_DIAGNOSTIC_ONLY\n' > '$deny_file' && printf 'SEMANTIQ_DENY_DIAGNOSTIC_ONLY\n' > '$ctrl_file' && ls -l '$deny_file' '$ctrl_file'"; then
            echo "::error::Could not create the mechanism C probe files. Mechanism C is INCONCLUSIVE."
            created=no
          else
            created=yes
          fi

          fail=0
          LEAKED=0

          # Reports status, body size and which known marker (if any) the body
          # carries. The markers are what make a status readable:
          #   SEMANTIQ_403_ERRORDOCUMENT_MARKER => Apache denied, status intact.
          #   SEMANTIQ_DENY_DIAGNOSTIC_ONLY     => the probe file was served.
          probe() {
            label="$1"; path="$2"
            code="$(curl -s -o /tmp/probe_body -w '%{http_code}' -m 25 "$APP_URL$path?cb=${GITHUB_SHA}")"
            bytes="$(wc -c < /tmp/probe_body 2>/dev/null | tr -d ' ')"
            marker="-"
            grep -q 'SEMANTIQ_403_ERRORDOCUMENT_MARKER' /tmp/probe_body 2>/dev/null && marker="403-errordocument"
            grep -q 'SEMANTIQ_DENY_DIAGNOSTIC_ONLY'     /tmp/probe_body 2>/dev/null && marker="probe-file-body"
            # Scanned per response, not once at the end: a scan after the loop
            # only ever sees the last body, and would have missed a leak in any
            # earlier probe.
            if grep -qE 'APP_KEY|DB_PASSWORD|DB_USERNAME|DB_DATABASE|MICROSOFT_CLIENT_SECRET|mysql://|/home/[a-z0-9]+/public_html' /tmp/probe_body 2>/dev/null; then
              echo "::error::$path returned a body carrying a secret marker, connection string or server path."
              LEAKED=1
            fi
            printf '%-34s %-44s %-6s %-9s %s\n' "$label" "$path" "$code" "${bytes:-0}" "$marker"
            printf '| %s | `%s` | %s | %s | %s |\n' "$label" "$path" "$code" "${bytes:-0}" "$marker" >> "$GITHUB_STEP_SUMMARY"
            LAST_CODE="$code"; LAST_MARKER="$marker"
          }

          {
            echo "### Apache denial-capability matrix"
            echo
            echo "| Probe | Path | Status | Bytes | Marker |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- matrix ---"
          printf '%-34s %-44s %-6s %-9s %s\n' "PROBE" "PATH" "STATUS" "BYTES" "MARKER"

          probe "A mod_rewrite [R=403,L]"    "/__semantiq_rewrite_403_probe"
          a_code="$LAST_CODE"; a_marker="$LAST_MARKER"

          probe "A-control mod_rewrite [F,L]" "/__semantiq_apache_deny_probe"
          f_code="$LAST_CODE"; f_marker="$LAST_MARKER"

          probe "B mod_alias RedirectMatch"  "/__semantiq_alias_403_probe"
          b_code="$LAST_CODE"; b_marker="$LAST_MARKER"

          probe "C Files+Require all denied" "/__semantiq_files_deny_probe.txt"
          c_code="$LAST_CODE"; c_marker="$LAST_MARKER"

          probe "C-control served sibling"   "/__semantiq_files_control_probe.txt"
          cc_code="$LAST_CODE"; cc_marker="$LAST_MARKER"

          echo "--- controls ---"
          probe "control nonexistent path"   "/__semantiq_absent_control_path"
          n_code="$LAST_CODE"
          probe "control site root"          "/"
          root_code="$LAST_CODE"
          probe "control liveness"           "/up"
          up_code="$LAST_CODE"
          probe "control console"            "/console"
          console_code="$LAST_CODE"
          probe "control acme passthrough"   "/.well-known/"
          wk_code="$LAST_CODE"
          probe "control dotfile"            "/.env"
          env_code="$LAST_CODE"; env_marker="$LAST_MARKER"
          probe "control directory"          "/vendor/"
          vendor_code="$LAST_CODE"; vendor_marker="$LAST_MARKER"

          echo
          echo "--- interpretation ---"

          # A 403 is only a positive if it did not come from the application.
          # The ErrorDocument marker is what distinguishes an Apache refusal
          # from anything Laravel could have produced.
          verdict() {
            name="$1"; code="$2"; marker="$3"
            case "$code" in
              403) echo "$name: VERIFIED - 403 from Apache (marker: $marker)" ;;
              404) echo "$name: NOT VERIFIED - 404. The request reached the forwarder and Laravel; the rule did not deny." ;;
              200) echo "$name: NOT VERIFIED - 200. The path was served." ;;
              *)   echo "$name: UNEXPECTED - $code." ;;
            esac
          }

          verdict "A  mod_rewrite [R=403,L]"     "$a_code" "$a_marker"
          verdict "A' mod_rewrite [F,L]"         "$f_code" "$f_marker"
          verdict "B  mod_alias RedirectMatch"   "$b_code" "$b_marker"

          # C is read differently, because C is the only probe whose negative
          # is falsifiable.
          if [ "$created" != "yes" ]; then
            echo "C  Files+Require: INCONCLUSIVE - the probe files could not be created."
          elif [ "$cc_code" != "200" ]; then
            echo "C  Files+Require: INCONCLUSIVE - the unguarded control file returned $cc_code, not 200."
            echo "   Files under public/ are not being served as assumed, so a 403 on the guarded file would prove nothing."
          elif [ "$c_code" = "403" ]; then
            echo "C  Files+Require: VERIFIED - the guarded file returned 403 while its unguarded sibling returned 200."
          elif [ "$c_code" = "200" ] && [ "$c_marker" = "probe-file-body" ]; then
            echo "C  Files+Require: NOT VERIFIED - the guarded file was served in full. This is a real negative: the file was reachable and the directive did not deny it."
          elif [ "$c_code" = "404" ]; then
            echo "C  Files+Require: INCONCLUSIVE - 404 while the control returned 200. The guarded file was not found where the control was."
          else
            echo "C  Files+Require: UNEXPECTED - $c_code (marker: $c_marker)."
          fi

          echo
          echo "controls: absent=$n_code root=$root_code up=$up_code console=$console_code well-known=$wk_code .env=$env_code vendor=$vendor_code"

          # Safety gates. These are failures, not findings.
          if [ "$env_code" = "200" ] || [ "$vendor_code" = "200" ]; then
            echo "::error::A real protected path returned 200 during the diagnostic. Security failure."
            fail=1
          fi
          if [ "$env_marker" = "probe-file-body" ] || [ "$vendor_marker" = "probe-file-body" ]; then
            echo "::error::A protected path returned diagnostic content. Security failure."
            fail=1
          fi
          if [ "$root_code" != "200" ] || [ "$up_code" != "200" ]; then
            echo "::error::The diagnostic changed live behaviour: site root or liveness is no longer 200."
            fail=1
          fi
          if [ "$wk_code" = "403" ]; then
            echo "::error::.well-known/ is now blocked; ACME renewal would fail."
            fail=1
          fi
          if [ "$LEAKED" = "1" ]; then
            echo "::error::At least one probe response carried a secret marker, connection string or server path."
            fail=1
          fi

          if [ "$a_code" = "403" ] || [ "$f_code" = "403" ] || [ "$b_code" = "403" ] || [ "$c_code" = "403" ]; then
            echo "::notice::APACHE ROOT DENIAL MECHANISM VERIFIED - at least one mechanism returned 403."
          else
            echo "::warning::HOST-LEVEL APACHE DENIAL CAPABILITY NOT PROVEN through the current .htaccess configuration."
          fi

          exit "$fail"
