# Deploy to cPanel over SSH.
#
# Two deployment states, per correction 1. The first P1-BASE deployment finds no
# Laravel installation on the server, so "artisan down" would fail and abort the
# pipeline before it could install the application that would have made the
# command work. Detection is an explicit probe, and a broken prior installation
# resolves to INITIAL rather than to an error - a half-installed server must
# never block installing its replacement.
name: Deploy to cPanel (SSH)

on:
  push:
    branches: main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and sync to cPanel over SSH
    runs-on: ubuntu-latest
    environment: development

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      APP_URL: https://semantiq.claas2saas.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Remove node_modules before deployment
        run: rm -rf node_modules

      # Assemble the exact tree the server should hold, on the runner, then
      # transfer that. The production layout is not the repository layout, and
      # building it here rather than fixing it up over SSH afterwards is what
      # makes rsync --delete able to remove the old public/ directory on its
      # own: a path absent from the source is a path --delete prunes.
      #
      # Repository                        Server
      #   public/index.php        ->        (gone - not the production entry)
      #   public/.htaccess        ->        (gone - merged into the root one)
      #   public/build/           ->        build/
      #   public/favicon.ico      ->        favicon.ico
      #   public/robots.txt       ->        robots.txt
      #   deployment/public_html.index.php -> index.php
      #   deployment/public_html.htaccess  -> .htaccess
      - name: Assemble the production tree
        run: |
          set -euo pipefail

          rm -rf _deploy
          mkdir -p _deploy
          rsync -a --exclude '.git/' --exclude '_deploy/' ./ _deploy/

          # Web-facing assets move from the repository's public/ to the
          # deployment root, which is what the server serves from.
          for asset in build favicon.ico robots.txt; do
            if [ -e "_deploy/public/$asset" ]; then
              mv "_deploy/public/$asset" "_deploy/$asset"
            fi
          done

          cp deployment/public_html.index.php _deploy/index.php
          cp deployment/public_html.htaccess  _deploy/.htaccess

          # The repository's public/ has no role on the server. Removing it here
          # means the transfer never carries it and --delete prunes the old one.
          rm -rf _deploy/public

          # Fail before transferring rather than after. Each of these is a
          # white-screen production outage if it is wrong.
          missing=0
          [ -f _deploy/index.php ]            || { echo "::error::No front controller at the deployment root."; missing=1; }
          [ -f _deploy/.htaccess ]            || { echo "::error::No .htaccess at the deployment root."; missing=1; }
          [ -f _deploy/build/manifest.json ]  || { echo "::error::No build/manifest.json at the deployment root; assets would 404."; missing=1; }
          [ -f _deploy/vendor/autoload.php ]  || { echo "::error::No vendor/autoload.php."; missing=1; }
          [ -f _deploy/bootstrap/app.php ]    || { echo "::error::No bootstrap/app.php."; missing=1; }
          [ ! -d _deploy/public ]             || { echo "::error::_deploy/public still exists; the old layout would be re-created."; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

          # The front controller must resolve its siblings, not walk up out of
          # the deployment root the way the stock public/ controller does.
          grep -q "__DIR__.'/vendor/autoload.php'" _deploy/index.php \
            || { echo "::error::The staged front controller does not resolve vendor/autoload.php as a sibling."; exit 1; }
          if grep -q "__DIR__.'/\.\./" _deploy/index.php; then
            echo "::error::The staged front controller walks up out of the deployment root."
            exit 1
          fi

          echo "::notice::Production tree assembled: root front controller, root .htaccess, assets at build/, no public/ layer."

      # Correction 3. The exclusion contract is enforced here, on the runner,
      # before anything is transferred. A missing entry fails the job rather than
      # deleting a file that exists nowhere else. A CI test makes the same
      # assertion on every pull request so it rarely gets this far.
      - name: Assert the rsync exclusion contract
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r path; do
            case "$path" in ''|\#*) continue ;; esac
            if ! grep -q -- "--exclude \"$path\"" "$GITHUB_WORKFLOW_REF_FILE"; then
              echo "::error::Protected path [$path] is not excluded in the rsync command."
              missing=1
            fi
          done < deployment/rsync-protected-paths.txt
          [ "$missing" -eq 0 ] || exit 1
        env:
          GITHUB_WORKFLOW_REF_FILE: .github/workflows/deploy.yml

      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          : "${CPANEL_SSH_PRIVATE_KEY:?CPANEL_SSH_PRIVATE_KEY secret is required}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?CPANEL_SSH_KEY_PASSPHRASE secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/cpanel_deploy_key </dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && pwd && command -v rsync && rsync --version | head -n 1"

      # A directory existing is not evidence of a working installation. All four
      # markers must hold, and anything else resolves to INITIAL.
      - name: Detect the installation state
        id: state
        run: |
          set -euo pipefail
          state="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" 2>/dev/null || exit 0; \
             [ -f artisan ] && [ -f vendor/autoload.php ] && [ -f bootstrap/app.php ] \
               && php artisan --version >/dev/null 2>&1 && echo EXISTING || true")"
          state="${state:-INITIAL}"
          [ "$state" = "EXISTING" ] || state="INITIAL"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployment state: $state"

      # Fail BEFORE the site goes down, not after.
      #
      # P1-00 makes the Microsoft keys required in production, and the health
      # check that enforces that runs after the maintenance window has already
      # opened - so a deployment missing them would abort with the site still in
      # maintenance and "artisan up" never reached. That is an outage caused by
      # a configuration check, which is the same shape as the APP_KEY deadlock
      # this pipeline hit once before.
      #
      # Checking here means a misconfigured deployment stops with production
      # untouched and still serving.
      #
      # PRESENCE ONLY. No value is read, printed, or transmitted anywhere. The
      # client secret in particular never leaves the server.
      - name: Verify identity configuration is present on the server
        run: |
          set -euo pipefail

          result="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" "bash -s -- '$CPANEL_DEPLOY_PATH'" <<'REMOTE'
          set -u
          cd "$1" 2>/dev/null || { echo 'FATAL_NO_DEPLOY_DIR'; exit 0; }
          [ -f .env ] || { echo 'FATAL_NO_ENV'; exit 0; }
          for key in MICROSOFT_TENANT_ID MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_REDIRECT_URI; do
            if grep -qE "^${key}=.+" .env; then
              echo "${key}=PRESENT"
            else
              echo "${key}=MISSING"
            fi
          done
          REMOTE
          )"

          echo "$result"

          if echo "$result" | grep -q 'FATAL_NO_ENV'; then
            echo "::error::No .env on the server. Provisioning has not been completed."
            exit 1
          fi

          if echo "$result" | grep -q 'FATAL_NO_DEPLOY_DIR'; then
            echo "::error::The deployment directory does not exist."
            exit 1
          fi

          if echo "$result" | grep -q 'MISSING'; then
            echo "::error::Required Microsoft identity configuration is missing from the server .env. Production has NOT been touched."
            exit 1
          fi

          echo "::notice::All four Microsoft identity settings are present and non-empty. No value was read."

      - name: Open the maintenance window
        if: steps.state.outputs.state == 'EXISTING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan down --retry=60"

      # --delete removes stale files, including the obsolete deploy-test
      # index.html at the document root. Every protected path is excluded, and an
      # exclusion protects against deletion as well as transfer - that is the
      # safety mechanism, asserted above before this runs.
      - name: Sync files to cPanel
        run: |
          set -euo pipefail
          rsync -az --delete --human-readable --itemize-changes \
            -e "ssh -i ~/.ssh/cpanel_deploy_key -p $CPANEL_PORT -o IdentitiesOnly=yes -o BatchMode=yes" \
            --exclude ".env" \
            --exclude ".well-known/" \
            --exclude "storage/" \
            --exclude "public/storage" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "deployment/" \
            --exclude "node_modules/" \
            --exclude "tests/" \
            --exclude "phpunit.xml" \
            --exclude "doc/" \
            --exclude "*.md" \
            --exclude ".editorconfig" \
            --exclude ".gitignore" \
            --exclude ".gitattributes" \
            --exclude ".env.example" \
            _deploy/ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_DEPLOY_PATH/"

      # Permanent security control. Under D-08B this one file IS the security
      # boundary, so every claim about what is protected rests on the server
      # copy being the copy under version control. Reviewing the repository file
      # proves nothing about what Apache actually reads.
      #
      # Introduced with the denial diagnostics and kept deliberately: it is what
      # makes the exposure gate below meaningful, and it catches a hand-edit on
      # the server - which is exactly the change nobody would otherwise notice.
      # A mismatch fails the deployment.
      #
      # Hashes only. No file content is printed.
      - name: Verify the deployed .htaccess matches the repository copy
        run: |
          set -euo pipefail

          expected="$(sha256sum deployment/public_html.htaccess | cut -d' ' -f1)"

          actual="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && { sha256sum .htaccess 2>/dev/null || shasum -a 256 .htaccess 2>/dev/null || openssl dgst -sha256 .htaccess 2>/dev/null; } | grep -oE '[0-9a-f]{64}' | head -1")"

          echo "expected (repository) : ${expected:-<none>}"
          echo "actual   (server)     : ${actual:-<none>}"

          if [ -z "$actual" ]; then
            echo "::error::Could not read a checksum for the deployed .htaccess."
            exit 1
          fi

          if [ "$expected" != "$actual" ]; then
            echo "::error::The deployed .htaccess does NOT match deployment/public_html.htaccess."
            exit 1
          fi

          echo "::notice::.htaccess integrity verified - the deployed file is the repository file."

      # The same permanent control as the .htaccess check, for the other file
      # the production layout depends on. A hand-edited index.php on the server
      # is the change nobody would otherwise notice.
      - name: Verify the deployed front controller matches the repository copy
        run: |
          set -euo pipefail

          expected="$(sha256sum deployment/public_html.index.php | cut -d' ' -f1)"

          actual="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && { sha256sum index.php 2>/dev/null || shasum -a 256 index.php 2>/dev/null; } | grep -oE '[0-9a-f]{64}' | head -1")"

          echo "expected (repository) : ${expected:-<none>}"
          echo "actual   (server)     : ${actual:-<none>}"

          if [ -z "$actual" ]; then
            echo "::error::No front controller at the deployment root on the server."
            exit 1
          fi

          if [ "$expected" != "$actual" ]; then
            echo "::error::The deployed index.php does NOT match deployment/public_html.index.php."
            exit 1
          fi

          echo "::notice::Front controller integrity verified."

      # rsync --delete prunes public/ because the assembled tree has none - but
      # the exclusion contract protects public/storage from deletion, so a
      # leftover symlink there could keep the directory alive. Remove it
      # explicitly, then prove it is gone: if public_html/public does not exist
      # and the site answers, nothing can be depending on it.
      - name: Remove the legacy public/ layer and prove it is not required
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && rm -rf ./public"

          state="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && if [ -e ./public ]; then echo SEMANTIQ_PUBLIC_PRESENT; else echo SEMANTIQ_PUBLIC_ABSENT; fi")"

          case "$state" in
            *SEMANTIQ_PUBLIC_ABSENT*)
              echo "::notice::public_html/public does not exist. The application cannot be depending on it." ;;
            *SEMANTIQ_PUBLIC_PRESENT*)
              echo "::error::public_html/public still exists. The old layout has not been removed."
              exit 1 ;;
            *)
              echo "::error::Could not determine whether public_html/public exists."
              exit 1 ;;
          esac

      - name: Ensure runtime directories exist and are writable
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache"

      # The server .env is created by the one-time provisioning of D-05 and is
      # never transferred.
      #
      # APP_KEY is bootstrapped here, and only here. The provisioning writes
      # .env by hand, a Laravel key cannot be written by hand, and before the
      # first deployment there is no remote artisan to generate one - so a check
      # that simply refused an empty key could never be satisfied. This step runs
      # after the sync, so the application it needs is already present.
      #
      # On an UPDATE deployment an existing key is mandatory and is never
      # regenerated: rotating it invalidates every encrypted cookie and session.
      # The logic lives in a script so it can be tested for real rather than
      # asserted about; see tests/Architecture/AppKeyBootstrapTest.php. It is
      # piped over stdin because deployment/ is excluded from rsync and has no
      # business on the host.
      - name: Verify the environment and bootstrap APP_KEY if this is the first deployment
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "sh -s -- \"$CPANEL_DEPLOY_PATH\" \"${{ steps.state.outputs.state }}\"" \
            < deployment/ensure-app-key.sh

      # Migration failure fails the deployment. On the EXISTING path the
      # application stays in maintenance: artisan up does not run after this, and
      # no rollback migration is triggered automatically, because a destructive
      # down() over a half-applied migration can lose data the failure did not.
      - name: Run database migrations
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan migrate --force --no-interaction"

      - name: Clear compiled caches
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan optimize:clear --no-interaction"

      - name: Verify application health over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan semantiq:health"

      - name: Close the maintenance window
        if: steps.state.outputs.state == 'EXISTING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && php artisan up"

      - name: Verify the site over HTTPS
        run: |
          set -euo pipefail
          # Cache-busted: a cached 200 from an earlier state would read as a pass.
          code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/?deploy=${GITHUB_SHA}")"
          [ "$code" = "200" ] || { echo "::error::Site root returned $code"; exit 1; }

          up="$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/up?deploy=${GITHUB_SHA}")"
          [ "$up" = "ok" ] || { echo "::error::/up returned [$up]"; exit 1; }

          # The built asset the page actually references must load, or the site
          # is "up" while rendering unstyled. Under the root layout these live
          # at /build/... rather than behind the old forwarder, so this is the
          # check that the asset move landed.
          # Manifest "file" values are relative to the build directory
          # (assets/app-XXXX.js), not rooted paths - so the /build prefix is
          # added here. Reading it the other way round silently matched nothing
          # and would have turned this check into an unconditional failure.
          asset="$(grep -oE 'assets/[A-Za-z0-9._-]+\.(js|css)' _deploy/build/manifest.json | head -1)"

          if [ -z "$asset" ]; then
            echo "::error::Could not read an asset path out of the build manifest."
            exit 1
          fi

          acode="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$APP_URL/build/$asset")"
          [ "$acode" = "200" ] || { echo "::error::Built asset /build/$asset returned $acode"; exit 1; }
          echo "::notice::Built asset /build/$asset served 200 from the deployment root."

          # Directory listing must be off now that assets are served from the
          # document root, or /build/ enumerates the bundle.
          bcode="$(curl -s -o /tmp/blist -w '%{http_code}' "$APP_URL/build/?cb=${GITHUB_SHA}")"
          case "$bcode" in
            403|404) ;;
            *) echo "::error::/build/ returned $bcode; directory listing may be enabled"; exit 1 ;;
          esac
          if grep -qE 'Index of|<a href="[^"]*\.js"' /tmp/blist 2>/dev/null; then
            echo "::error::/build/ returned a directory listing."
            exit 1
          fi

          # The old layout must not still be serving. If public_html/public is
          # gone, a 403 from the deny rule is the only correct answer here.
          pcode="$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/public/index.php?cb=${GITHUB_SHA}")"
          [ "$pcode" = "403" ] || { echo "::error::/public/index.php returned $pcode; expected 403. The legacy layer may still be reachable."; exit 1; }

          echo "::notice::Site root 200, /up ok, assets served from the deployment root, no legacy public/ layer."

      # Correction: a redirect is not proof. A 302 means the request reached the
      # application; the requirement is that these files are never served.
      # The live security gate. Under D-08B the Laravel tree sits inside the
      # document root, so this is the check that the boundary is real - not a
      # convention, not a code review, an observed HTTPS response.
      #
      # It requires 403, not "403 or 404".
      #
      # Those two used to be treated as equally acceptable, because a 404 was
      # believed to be the best this host could produce. PR #38 disproved that:
      # Apache does deny at the document root, by four independent mechanisms,
      # and the 404s were a path-valued ErrorDocument masking the 403 by
      # re-entering the rewrite chain. With the literal ErrorDocument in place
      # the true status is visible, so a 404 here now means something specific
      # and bad: the request fell THROUGH the Apache boundary into Laravel, and
      # the deny rule that should have stopped it did not. That is a regression
      # in the security boundary and it fails the deployment.
      - name: Web-exposure negative tests
        run: |
          set -euo pipefail
          failed=0

          # Every path here is owned by the Apache boundary in
          # deployment/public_html.htaccess. All were observed returning 403 in
          # production before this gate was tightened, so a 404 is a real
          # regression rather than an untested expectation.
          for path in \
            ".env" ".env.example" ".gitignore" ".git/config" \
            "composer.json" "composer.lock" "package.json" "package-lock.json" \
            "artisan" "phpunit.xml" "vite.config.js" \
            "app/" "bootstrap/" "config/" "database/" "resources/" "routes/" \
            "storage/" "tests/" "vendor/" "deployment/" "doc/" "public/" \
            "README.md" "deployment/public_html.htaccess" "storage/logs/laravel.log"
          do
            code="$(curl -s -o /tmp/body -w '%{http_code}' "$APP_URL/$path?cb=${GITHUB_SHA}")"
            case "$code" in
              403) ;;
              404)
                echo "::error::$path returned 404. The Apache deny rule did not fire and the request reached Laravel; the security boundary is no longer observable."
                failed=1 ;;
              *)
                echo "::error::$path returned $code; 403 required (a redirect is not proof)"
                failed=1 ;;
            esac

            # A 403 that still leaks something in its body is not a pass. The
            # denial response must reveal no secret, connection string, server
            # path, stack trace or framework internals.
            if grep -qE 'APP_KEY|DB_DATABASE|DB_USERNAME|DB_PASSWORD|MICROSOFT_CLIENT_SECRET|mysql://|/home/[a-z0-9]+/public_html' /tmp/body 2>/dev/null; then
              echo "::error::$path response contained a secret marker, connection string or server path"; failed=1
            fi
            if grep -qE '<\?php|Stack trace:|vendor/laravel|Illuminate\\\\|Whoops' /tmp/body 2>/dev/null; then
              echo "::error::$path response leaked PHP source, a stack trace or framework internals"; failed=1
            fi
          done

          # The denial body itself must stay bare. If someone points
          # ErrorDocument 403 at a path, Apache re-enters the rewrite chain and
          # the masking returns - so assert the shape of what a denial returns,
          # not just its status.
          curl -s -o /tmp/deny -m 20 "$APP_URL/.env?cb=${GITHUB_SHA}" || true
          deny_bytes="$(wc -c < /tmp/deny | tr -d ' ')"
          echo "denial body: ${deny_bytes} bytes"
          if [ "${deny_bytes:-0}" -gt 512 ]; then
            echo "::error::The 403 body is ${deny_bytes} bytes. A bare denial is expected; this looks like a rendered page, which suggests ErrorDocument is resolving through the application again."
            failed=1
          fi

          # TLS renewal must keep working, and this now tests the thing that
          # actually renews it rather than a proxy for it.
          #
          # The old check asserted that /.well-known/ was not 403. That was a
          # reasonable stand-in while the directory answered 200 with a listing,
          # but it was never what ACME uses - and the moment Options -Indexes
          # turned the listing off, the check failed on a certificate path that
          # was working perfectly. A gate that fails on a healthy system gets
          # ignored, which is worse than not having it.
          #
          # Let's Encrypt requests one FILE it has just written under
          # .well-known/acme-challenge and reads the body back. So that is what
          # this does: write a token, fetch it over HTTPS, require 200 with the
          # exact body, and remove it whatever happens. Nothing is inferred.
          acme_token="semantiq-acme-selftest-${GITHUB_SHA}"
          acme_dir="$CPANEL_DEPLOY_PATH/.well-known/acme-challenge"
          acme_ssh="ssh -i $HOME/.ssh/cpanel_deploy_key -p $CPANEL_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 $CPANEL_USER@$CPANEL_HOST"

          cleanup_acme() {
            $acme_ssh "rm -f '$acme_dir/$acme_token'" \
              || echo "::warning::Could not remove the ACME self-test token; it contains no secret."
          }
          trap cleanup_acme EXIT

          if $acme_ssh "mkdir -p '$acme_dir' && printf 'SEMANTIQ_ACME_SELFTEST\n' > '$acme_dir/$acme_token'"; then
            acode="$(curl -s -o /tmp/acme -w '%{http_code}' -m 25 "$APP_URL/.well-known/acme-challenge/$acme_token")"
            if [ "$acode" != "200" ]; then
              echo "::error::An ACME challenge file returned $acode, not 200. Certificate renewal WILL fail."
              failed=1
            elif ! grep -q 'SEMANTIQ_ACME_SELFTEST' /tmp/acme; then
              echo "::error::The ACME challenge path returned 200 but not the file's contents. Renewal would fail validation."
              failed=1
            else
              echo "::notice::ACME challenge file served verbatim over HTTPS; certificate renewal path is intact."
            fi
          else
            echo "::error::Could not write an ACME self-test token; the challenge directory may not be writable."
            failed=1
          fi

          # The directory itself must NOT list. That is a change from the old
          # behaviour and an improvement: enumerating .well-known was never
          # required by ACME and only advertised what is there.
          wk="$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/.well-known/?cb=${GITHUB_SHA}")"
          case "$wk" in
            403|404) ;;
            *) echo "::error::/.well-known/ returned $wk; directory listing may be enabled"; failed=1 ;;
          esac

          # The application must still be alive. A boundary that denies
          # everything, including the site, is not a passing state.
          for pair in "/:200" "/up:200"; do
            p="${pair%:*}"; want="${pair##*:}"
            got="$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL$p?cb=${GITHUB_SHA}")"
            [ "$got" = "$want" ] || { echo "::error::$p returned $got, expected $want"; failed=1; }
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "::notice::Web-exposure gate passed: every protected path returned 403 from Apache."
