# Read-only P1-04 business domain state verification.
#
# MANUAL DISPATCH ONLY, AND IT WRITES NOTHING. Every statement it makes comes
# from a SELECT. Its sibling, initialise-domains.yml, is the one that writes,
# and it says so in its name - these two must never be confused, which is why
# this one carries "(read-only)" in its own.
#
# IT REPORTS CODES, KINDS, STATUSES AND COUNTS. Not a domain description, not a
# person's name, not an email, not an Object ID. A domain's NAME is the
# organisation's own words and is deliberately absent too: the CODE is what
# identifies a domain across deployments, and the name adds nothing this report
# needs while being business content.
#
# WHY IT EXISTS. "Nothing here grants access to anything" is the sentence P1-04
# was built to defend, and the screens can only be checked by somebody signed
# in. This answers the two questions an administrator cannot ask from outside:
# how many domains are enabled, and how many people have been made accountable
# for one - without reading a single word of business content to do it.

name: Verify P1-04 business domain state (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Report business domain state over SSH
    runs-on: ubuntu-latest
    environment: development

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          : "${CPANEL_SSH_PRIVATE_KEY:?CPANEL_SSH_PRIVATE_KEY secret is required}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?CPANEL_SSH_KEY_PASSPHRASE secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/cpanel_deploy_key </dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      # Codes, kinds, statuses and counts. Nothing else leaves the server.
      - name: Report business domain state
        run: |
          set -euo pipefail

          out="$(ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" "cd \"$CPANEL_DEPLOY_PATH\" && php artisan tinker --execute='
              \$rows = [];
              foreach (\App\Modules\Domains\Models\BusinessDomain::query()->orderBy(\"id\")->get() as \$d) {
                \$rows[] = [
                  \"code\" => \$d->code,
                  \"kind\" => \$d->kind->value,
                  \"status\" => \$d->status->value,
                  \"access_expectation\" => \$d->access_expectation->value,
                  \"renamed\" => \$d->kind->isBaseline()
                    && \$d->name !== (\App\Modules\Domains\Support\BaselineDomains::CATALOGUE[\$d->code] ?? null),
                  \"has_current_owner\" => \$d->currentOwnership()->exists(),
                  \"ownership_periods\" => \$d->ownerships()->count(),
                ];
              }

              echo json_encode([
                \"domains\"             => \$rows,
                \"domains_total\"       => count(\$rows),
                \"enabled_total\"       => \App\Modules\Domains\Models\BusinessDomain::query()->where(\"status\", \"enabled\")->count(),
                \"custom_total\"        => \App\Modules\Domains\Models\BusinessDomain::query()->where(\"kind\", \"custom\")->count(),
                \"ownership_rows_total\" => \App\Modules\Domains\Models\DomainOwnership::query()->count(),
                \"current_owners_total\" => \App\Modules\Domains\Models\DomainOwnership::query()->whereNull(\"ended_at\")->count(),
                \"platform_roles_total\" => \App\Modules\Platform\Models\User::query()->whereNotNull(\"platform_role\")->count(),
              ], JSON_PRETTY_PRINT);
            '")"

          echo "$out"

          # GUARDS, NOT DECORATION.
          if printf '%s' "$out" | grep -qE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'; then
            echo "::error::The report contains an email address. Refusing to leave it in the log."
            exit 1
          fi

          python3 - "$out" <<'PYEOF'
          import json, sys
          raw = sys.argv[1]
          data = json.loads(raw[raw.index('{'):raw.rindex('}') + 1])

          problems = []

          baseline = [d for d in data['domains'] if d['kind'] == 'baseline']
          codes = [d['code'] for d in baseline]
          expected = ['executive', 'sales', 'finance', 'people', 'operations', 'customer', 'learning']

          for code in expected:
              if code not in codes:
                  problems.append(f'Baseline domain [{code}] is missing.')

          if len(codes) != len(set(codes)):
              problems.append('A baseline code appears more than once.')

          # THE POINT OF THE WHOLE WORKFLOW.
          #
          # An ENABLED domain must have somebody accountable for it - D-42. The
          # screens refuse to enable one without an active owner; this checks the
          # stored state rather than the screen, because a state nobody can reach
          # through the UI can still arrive through a migration, a fix, or a bug.
          for d in data['domains']:
              if d['status'] == 'enabled' and not d['has_current_owner']:
                  problems.append(f"Domain [{d['code']}] is ENABLED with nobody accountable for it.")

          # And the P1-05 seam is still exactly where P1-04 left it: one column,
          # and P1-04 has not started writing roles.
          if data['platform_roles_total'] > 1:
              problems.append('More than one user carries a platform role. P1-05 owns the role model.')

          for p in problems:
              print(f'::error::{p}')

          print('::notice::' + str(data['domains_total']) + ' domains ('
                + str(data['enabled_total']) + ' enabled, ' + str(data['custom_total'])
                + ' custom), ' + str(data['current_owners_total']) + ' current owners across '
                + str(data['ownership_rows_total']) + ' ownership periods.')

          sys.exit(1 if problems else 0)
          PYEOF
