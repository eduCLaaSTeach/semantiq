# Proves the GitHub -> cPanel path end to end with a static page.
#
# Scope is deliberately narrow. The page is published into
# public/deploy-test/ on the server, never the web root, and the --delete
# below can therefore only ever affect that one directory. The running
# application, the server .env, storage/ and uploads are untouched.
#
# On the URL below. The deploy path is itself the document root, and it holds
# no front-door .htaccess: the first run of this workflow proved that by
# transferring the file successfully and then getting a 404 at /deploy-test/.
# public/ is therefore exposed literally rather than being rewritten into, so
# public/deploy-test/index.html is served at /public/deploy-test/. When the new
# application lands and restores a forwarder, this URL is what has to change.
#
# The SSH and rsync mechanics are carried over unchanged from the previous
# deployment workflow, which was known to work. Nothing about the transport
# is new here, which is what makes this a fair test of it.
name: Deploy test page

on:
  push:
    branches: main
    paths:
      - 'public/**'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish the test page over SSH
    runs-on: ubuntu-latest

    # Environment-scoped secrets live here; without this binding none of the
    # CPANEL_* values below resolve.
    environment: development

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Stamp the commit and time into the page. A test that served a static
      # file could pass against a copy left behind by an earlier run; a page
      # carrying this run's SHA cannot.
      - name: Stage the page and stamp this run into it
        run: |
          set -euo pipefail
          mkdir -p _site
          cp public/index.html _site/index.html

          sed -i \
            -e "s|__COMMIT__|${GITHUB_SHA}|g" \
            -e "s|__REF__|${GITHUB_REF_NAME}|g" \
            -e "s|__DEPLOYED_AT__|$(date -u '+%Y-%m-%d %H:%M:%S UTC')|g" \
            -e "s|__RUN__|${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})|g" \
            _site/index.html

          grep -q "$GITHUB_SHA" _site/index.html

      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Everything this step creates is 0600 from the outset, so the key
          # never exists briefly world-readable.
          umask 077

          : "${CPANEL_SSH_PRIVATE_KEY:?CPANEL_SSH_PRIVATE_KEY secret is required}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?CPANEL_SSH_KEY_PASSPHRASE secret is required}"

          install -m 700 -d ~/.ssh

          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          EOF

          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 \
          SSH_ASKPASS="$HOME/.ssh/askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
          ssh-add ~/.ssh/cpanel_deploy_key </dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/cpanel_deploy_key \
            -p "$CPANEL_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd \"$CPANEL_DEPLOY_PATH\" && pwd && command -v rsync && rsync --version | head -n 1"

      # --delete is scoped to public/deploy-test/. It cannot reach the web
      # root, the application tree, or anything the site serves today.
      - name: Publish to public/deploy-test/
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/cpanel_deploy_key \
            -p "$CPANEL_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "mkdir -p \"$CPANEL_DEPLOY_PATH/public/deploy-test\""

          rsync -az \
            --delete \
            --human-readable \
            --itemize-changes \
            -e "ssh -i ~/.ssh/cpanel_deploy_key -p $CPANEL_PORT -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./_site/ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_DEPLOY_PATH/public/deploy-test/"

      # Read the page back over HTTPS. Copying bytes to the server only proves
      # the transfer; this proves the web server actually serves them, which is
      # the part the .htaccess forwarder decides.
      - name: Verify the page is served
        run: |
          set -euo pipefail

          url="https://semantiq.claas2saas.com/public/deploy-test/"
          echo "Fetching $url"

          body="$(curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors "$url")"

          if printf '%s' "$body" | grep -q "$GITHUB_SHA"; then
            echo "::notice::Deploy test passed. $url is serving commit $GITHUB_SHA"
          else
            echo "::error::$url responded but does not carry commit $GITHUB_SHA."
            echo "The transfer succeeded, so this points at the URL mapping or caching,"
            echo "not at the GitHub to cPanel transfer itself."
            exit 1
          fi
